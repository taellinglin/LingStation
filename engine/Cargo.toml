[package]
name = "engine"
version.workspace = true
edition.workspace = true

[dependencies]
cpal = "0.15"
midir = "0.8"
midly = "0.5"
vst3-sys = { git = "https://github.com/RustAudio/vst3-sys" }
vst3 = "0.3"
libloading = "0.8"
com-scrape-types = "0.1"
clack-host = { git = "https://github.com/prokopyl/clack", package = "clack-host" }
clack-common = { git = "https://github.com/prokopyl/clack", package = "clack-common" }
clack-extensions = { git = "https://github.com/prokopyl/clack", package = "clack-extensions", features = ["clack-host", "params", "state", "gui", "latency", "log", "timer", "raw-window-handle_06"] }
clap-sys = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
rand = "0.8"
log = "0.4"
thiserror = "1.0"
hound = "3.5"
ogg = "0.8"
vorbis-encoder = "0.1"
flacenc = "0.5.1"
rustfft = "6.2"
spin = "0.10.0"
raw-window-handle = "0.6"
parking_lot = "0.12"
rayon = "1.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_System_Com",
    "Win32_System_Ole",
] }

[features]
vst3 = []
